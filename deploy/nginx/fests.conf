# FE_STS 本番 Nginx 設定
# 配置先: /etc/nginx/conf.d/fests.conf
# your-domain.com を実際のドメインに置換すること
#
# 適用手順:
#   sudo nginx -t && sudo systemctl reload nginx

# レート制限ゾーン定義 (http コンテキスト = conf.d 内の server 外でOK)
# アプリ側の AuthRateLimitFilter と二段構え。Nginx側は粗く、アプリ側は細かく制限する。
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=api_limit:10m  rate=10r/s;

server {
    listen 80;
    server_name your-domain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name your-domain.com;

    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # ---- セキュリティヘッダー ----
    # HSTS: 一度アクセスしたブラウザに以後HTTPSを強制 (1年)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # クリックジャッキング防止
    add_header X-Frame-Options "DENY" always;
    # MIMEスニッフィング防止
    add_header X-Content-Type-Options "nosniff" always;
    # リファラ抑制
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP: React SPA + 同一オリジンAPI前提。外部CDNを使う場合は適宜追加すること
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;

    # アイコンアップロードの上限に合わせる (Spring側 max-file-size: 5MB)
    client_max_body_size 6m;

    # ---- React SPA (ビルド済み静的ファイル) ----
    root /var/www/fests;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静的アセットは長期キャッシュ (Viteはファイル名にハッシュを付与するため安全)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ---- 認証API: 厳しめのレート制限 ----
    location /api/auth/ {
        limit_req zone=auth_limit burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        # $remote_addr で上書きすることでクライアントによるXFF偽装を防止
        # (アプリ側 AuthRateLimitFilter がこの値を信頼する前提)
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- その他API (ハートビート含む) ----
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ヘルスチェック (UptimeRobot等の監視用)
    location /actuator/health {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        access_log off;
    }

    # Spring Boot Actuatorのhealth以外は外部公開しない
    location /actuator/ {
        deny all;
    }
}
