spring:
  application:
    name: fests-backend

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/fests?useSSL=true&serverTimezone=Asia/Tokyo}
    username: ${DB_USERNAME:fests_user}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expire-ms: 3600000     # 1時間
    refresh-token-expire-days: ${REFRESH_TOKEN_EXPIRE_DAYS:14}   # リフレッシュトークン有効期限(日)
  mail:
    from-name: "FE_STS 運営チーム"
    from-address: ${MAIL_FROM_ADDRESS:noreply@example.com}
    verify-url-base: ${VERIFY_URL_BASE:http://localhost:5183/verify}
    token-expire-hours: 24
    # RenderがSMTPポートをブロックするためBrevoはHTTP APIで利用する(docs/04)
    brevo-api-base: ${BREVO_API_BASE:https://api.brevo.com}
    brevo-api-key: ${BREVO_API_KEY:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5183}
  dev:
    expose-verification-link: false
  presence:
    online-threshold-minutes: ${ONLINE_THRESHOLD_MINUTES:5}
    # last_seen_at の更新間隔。オンライン判定のしきい値より十分短くすること(issue #30)
    touch-throttle-seconds: ${TOUCH_THROTTLE_SECONDS:60}
  security:
    # 信頼するリバースプロキシの段数。X-Forwarded-For を右から数えてこの数だけ遡った
    # 位置をクライアントIPとみなす(issue #25)。プロキシを介さない場合は 0 にする
    trusted-proxy-count: ${TRUSTED_PROXY_COUNT:1}
  study-session:
    heartbeat-timeout-seconds: ${HEARTBEAT_TIMEOUT_SECONDS:90}
    max-duration-hours: ${MAX_SESSION_DURATION_HOURS:8}
    cleanup-interval-ms: ${SESSION_CLEANUP_INTERVAL_MS:30000}

server:
  port: 8080
