# ローカルでフロントエンドと繋いで動作確認するためのプロファイル。
# MySQL/Brevoが無くても `./mvnw spring-boot:run -Dspring-boot.run.profiles=local` で起動できる。
spring:
  datasource:
    url: jdbc:h2:file:./data/fests-local;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  flyway:
    enabled: false

app:
  jwt:
    secret: bG9jYWwtZGV2LW9ubHktc2VjcmV0LWtleS1kby1ub3QtdXNlLWluLXByb2QtMTIzNDU2
  mail:
    from-address: noreply@local.test
    verify-url-base: http://localhost:5183/verify
  cors:
    allowed-origins: http://localhost:5183,http://127.0.0.1:5183
  dev:
    expose-verification-link: true
